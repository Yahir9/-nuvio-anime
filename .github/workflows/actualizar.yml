
name: Actualizar catalogo Nuvio Anime

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */12 * * *"

  push:
    branches:
      - main
    paths:
      - "sources.json"
      - "manifest.json"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nuvio-anime-pages
  cancel-in-progress: false

jobs:
  generar:
    name: Generar catalogo y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar catalogo y fuentes
        env:
          HLS_SOURCE_URL: ${{ secrets.HLS_SOURCE_URL }}
          ANIME_FEED_URL: ${{ secrets.ANIME_FEED_URL }}
        run: |
          python scripts/build.py

      - name: Verificar archivos generados
        run: |
          test -f public/manifest.json
          test -f public/catalog/series/anime.json

          python -m json.tool public/manifest.json > /dev/null
          python -m json.tool public/catalog/series/anime.json > /dev/null

          echo "Archivos JSON correctos"

      - name: Preparar GitHub Pages
        run: |
          touch public/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar addon Nuvio Anime
        id: deployment
        uses: actions/deploy-pages@v4

name: Actualizar catalogo Anime
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
  push:
    paths:
      - 'sources.json'
      - 'scripts/build.py'
      - '.github/workflows/actualizar.yml'
      - 'manifest.json'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nuvio-anime-pages
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4
      - name: Generar API estatica
        env:
          HLS_SOURCE_URL: ${{ secrets.HLS_SOURCE_URL }}
          MAX_ANIMES: '40'
        run: python scripts/build.py
      - name: Preparar Pages
        run: |
          cp manifest.json public/manifest.json
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
      - 'data/**'

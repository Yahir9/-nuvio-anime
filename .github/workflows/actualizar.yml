
name: Actualizar Nuvio Anime

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */12 * * *"

  push:
    branches:
      - main
    paths:
      - "sources.json"
      - "manifest.json"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/actualizar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nuvio-anime-pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install beautifulsoup4

      - name: Detectar episodios
        run: python scripts/extract_episodes.py

      - name: Extraer fuentes HLS
        run: python scripts/extract_m3u.py

      - name: Generar catalogo Nuvio
        env:
          HLS_SOURCE_URL: ${{ secrets.HLS_SOURCE_URL }}
        run: python scripts/build.py

      - name: Verificar resultados
        run: |
          test -f public/manifest.json
          test -f public/catalog/series/anime.json
          python -m json.tool public/manifest.json > /dev/null
          python -m json.tool public/catalog/series/anime.json > /dev/null

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar Nuvio Anime
        id: deployment
        uses: actions/deploy-pages@v4

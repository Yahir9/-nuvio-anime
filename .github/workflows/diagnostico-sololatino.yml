name: Diagnostico SoloLatino

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analizar HTML
        run: python scripts/diagnose_sololatino.py
      - name: Guardar reporte descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-sololatino
          path: reports/sololatino/
          if-no-files-found: warn
          retention-days: 14
